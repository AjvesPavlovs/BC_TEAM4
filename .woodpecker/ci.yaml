when:
  - event: push
    branch: feature/woodpecker-ci

steps:
  - name: check-project-files
    image: alpine:3.21
    commands:
      - test -f Dockerfile
      - test -f index.html

  - name: build-container-image
    image: woodpeckerci/plugin-kaniko:2.3.4
    settings:
      registry: index.docker.io
      repo: aivisp/slice.sip.app.v1.0
      tags: ${CI_COMMIT_SHA}
      username:
        from_secret: dockerhub_user
      password:
        from_secret: dockerhub_token