---
# Phase 6H: read-only ECS service release inspection.
# Does not update services, register task definitions, or roll back anything.
- name: Inspect Slice and Sip ECS deployment safely
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    aws_region: eu-west-1
    ecs_cluster_name: slice-sip-ecs
    ecs_service_name: slice-sip-app
    ecs_allow_missing: false
  tasks:
    - name: Read ECS deployment status and target health
      ansible.builtin.command:
        argv: >-
          {{ ['python3', playbook_dir + '/../ci/ecs_release_status.py',
              '--region', aws_region, '--cluster', ecs_cluster_name,
              '--service', ecs_service_name]
              + (['--allow-missing'] if (ecs_allow_missing | bool) else []) }}
      environment:
        PATH: /opt/slice-sip/bin:/usr/local/bin:/usr/bin:/bin
      register: ecs_status_result
      changed_when: false
      failed_when: false

    - name: Display ECS inspection results
      ansible.builtin.debug:
        var: ecs_status_result.stdout_lines

    - name: Require successful ECS inspection
      ansible.builtin.assert:
        that:
          - ecs_status_result.rc == 0
        fail_msg: >-
          ECS inspection did not pass (exit {{ ecs_status_result.rc }}):
          {{ ecs_status_result.stderr | default('') }}.
          See the status output above; no changes were made.
