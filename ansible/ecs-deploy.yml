---
# Phase 6D: standalone, opt-in ECS deployment playbook.
# This is NOT connected to the Woodpecker build pipeline yet.
- name: Preview or explicitly deploy Slice and Sip to ECS Fargate
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    aws_region: eu-west-1
    project_name: slice-sip
    image_tag: ""
    deploy_enabled: false
    deploy_confirmation: ""
    deploy_worker: false

  tasks:
    - name: Require a versioned image tag and explicit deployment confirmation
      ansible.builtin.assert:
        that:
          - image_tag is match('^[0-9a-f]{40}-[1-9][0-9]*$')
          - (not (deploy_enabled | bool)) or deploy_confirmation == 'DEPLOY_SLICE_SIP'
        fail_msg: >-
          Supply -e image_tag=<40-character-sha>-<pipeline-number>.
          Live deployment additionally requires -e deploy_enabled=true
          -e deploy_confirmation=DEPLOY_SLICE_SIP.

    - name: Run preflight, or deploy only when explicitly enabled
      ansible.builtin.command:
        argv: >-
          {{ ['python3', playbook_dir + '/../ci/ecs_deploy.py',
              '--region', aws_region, '--project', project_name,
              '--tag', image_tag]
              + (['--include-worker'] if (deploy_worker | bool) else [])
              + (['--deploy'] if (deploy_enabled | bool) else []) }}
      register: ecs_deployment_result
      changed_when: (deploy_enabled | bool) and ("Requested ECS deployment:" in ecs_deployment_result.stdout)

    - name: Display the non-sensitive summary
      ansible.builtin.debug:
        var: ecs_deployment_result.stdout_lines
