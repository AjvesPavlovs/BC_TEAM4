---
# Phase 4A: stage Woodpecker CI on the instructor-provided Ubuntu host.
# Deliberately DOES NOT install/upgrade/restart Docker, Ansible or Git.
# Safe default: only stage files, do not start containers.
- name: Stage Slice and Sip CI files on existing EC2
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    woodpecker_enable: false
    # Opt in separately; never replace the working manual service by default.
    ngrok_manage: false
    # Opt in only after placing the Woodpecker API token on the EC2 host.
    ecr_secret_refresh_manage: false
    ngrok_hostname: canary-obedient-patriarch.ngrok-free.dev
    ci_directory: /opt/slice-sip-ci
    ci_secret_directory: /etc/slice-sip-ci
    ci_compose_project: slice-sip-ci
  tasks:
    - name: Verify Ubuntu 22.04 x86_64 before changing host files
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '22.04'
          - ansible_architecture == 'x86_64'
        fail_msg: >-
          This playbook is only approved for Ubuntu 22.04 x86_64.
          Do not proceed on another base image.

    - name: Inspect existing Docker packages (read only)
      ansible.builtin.package_facts:
        manager: apt

    - name: Require the existing official Docker CE and Compose installation
      ansible.builtin.assert:
        that:
          - "'docker-ce' in ansible_facts.packages"
          - "'docker-ce-cli' in ansible_facts.packages"
          - "'docker-compose-plugin' in ansible_facts.packages"
          - "'docker.io' not in ansible_facts.packages"
        fail_msg: >-
          Docker packages differ from the verified bootcamp instance.
          Stop and inspect before modifying them; this playbook never installs Docker.

    - name: Verify Docker daemon is active (read only)
      ansible.builtin.command: systemctl is-active docker
      register: docker_active
      changed_when: false
      check_mode: false

    - name: Verify Docker Compose is available (read only)
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false
      check_mode: false

    - name: Verify Git is available (read only)
      ansible.builtin.command: git --version
      register: git_version
      changed_when: false
      check_mode: false

    - name: Create CI Compose directory
      ansible.builtin.file:
        path: "{{ ci_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create root-only CI secrets directory (no credentials stored yet)
      ansible.builtin.file:
        path: "{{ ci_secret_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Stage Woodpecker Compose definition (not started)
      ansible.builtin.copy:
        src: ../ci/docker-compose.yml
        dest: "{{ ci_directory }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
        backup: true
      # Directories are only *predicted* in Ansible check mode. Copying into
      # them would fail on first dry run because they do not yet exist.
      when: not ansible_check_mode

    - name: Check for protected Woodpecker credentials
      ansible.builtin.stat:
        path: "{{ ci_secret_directory }}/woodpecker.env"
      register: ci_env

    - name: Require secure existing credentials before optional start
      ansible.builtin.assert:
        that:
          - ci_env.stat.exists
          - ci_env.stat.pw_name | default('') == 'root'
          - ci_env.stat.gr_name | default('') == 'root'
          - ci_env.stat.mode | default('') == '0600'
        fail_msg: >-
          Before starting Woodpecker, create /etc/slice-sip-ci/woodpecker.env
          owned by root:root and mode 0600; configure approved HTTPS and GitHub OAuth.
      when: woodpecker_enable | bool

    - name: Verify Compose configuration before optional start
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ ci_compose_project }}"
          - --env-file
          - "{{ ci_secret_directory }}/woodpecker.env"
          - -f
          - "{{ ci_directory }}/docker-compose.yml"
          - config
          - --quiet
      changed_when: false
      no_log: true
      when: woodpecker_enable | bool

    - name: Start Woodpecker only when explicitly approved
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ ci_compose_project }}"
          - --env-file
          - "{{ ci_secret_directory }}/woodpecker.env"
          - -f
          - "{{ ci_directory }}/docker-compose.yml"
          - up
          - -d
      no_log: true
      when: woodpecker_enable | bool

    - name: Check that ngrok configuration exists before optional management
      ansible.builtin.stat:
        path: /home/ssm-user/.config/ngrok/ngrok.yml
      register: ngrok_config
      when: ngrok_manage | bool

    - name: Require existing ngrok authentication configuration
      ansible.builtin.assert:
        that:
          - ngrok_config.stat.exists | default(false)
        fail_msg: >-
          Stop: ngrok agent config missing. Set up ngrok securely first;
          never commit its authtoken to the repository.
      when: ngrok_manage | bool

    - name: Manage ngrok systemd unit only when explicitly enabled
      ansible.builtin.template:
        src: templates/ngrok-woodpecker.service.j2
        dest: /etc/systemd/system/ngrok-woodpecker.service
        owner: root
        group: root
        mode: '0644'
        backup: true
      register: ngrok_unit
      when: ngrok_manage | bool

    - name: Ensure ngrok service is enabled and running (opt-in)
      ansible.builtin.systemd_service:
        name: ngrok-woodpecker
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if (ngrok_unit.changed | default(false)) else 'started' }}"
      when:
        - ngrok_manage | bool
        - not ansible_check_mode


    - name: Check root-only Woodpecker API token before managing ECR refresh
      ansible.builtin.stat:
        path: /etc/slice-sip-ci/woodpecker-api-token
      register: ecr_api_token
      when: ecr_secret_refresh_manage | bool

    - name: Require a protected Woodpecker API token
      ansible.builtin.assert:
        that:
          - ecr_api_token.stat.exists | default(false)
          - ecr_api_token.stat.pw_name | default('') == 'root'
          - ecr_api_token.stat.mode | default('') == '0600'
        fail_msg: >-
          Missing protected Woodpecker API token. Create it root:root mode 0600
          before enabling ECR credential rotation. No tokens belong in Git.
      when: ecr_secret_refresh_manage | bool

    - name: Create privileged-only publisher directory
      ansible.builtin.file:
        path: /usr/local/libexec/slice-sip-ci
        state: directory
        owner: root
        group: root
        mode: '0750'
      when: ecr_secret_refresh_manage | bool

    - name: Install ECR token rotation helper (no credentials inside)
      ansible.builtin.copy:
        src: ../ci/refresh-ecr-woodpecker-secret.py
        dest: /usr/local/libexec/slice-sip-ci/refresh-ecr-woodpecker-secret.py
        owner: root
        group: root
        mode: '0750'
      when:
        - ecr_secret_refresh_manage | bool
        - not ansible_check_mode

    - name: Install ECR token refresh oneshot unit
      ansible.builtin.copy:
        src: ../ci/systemd/slice-sip-ecr-secret.service
        dest: /etc/systemd/system/slice-sip-ecr-secret.service
        owner: root
        group: root
        mode: '0644'
      when: ecr_secret_refresh_manage | bool

    - name: Install ECR token refresh timer
      ansible.builtin.copy:
        src: ../ci/systemd/slice-sip-ecr-secret.timer
        dest: /etc/systemd/system/slice-sip-ecr-secret.timer
        owner: root
        group: root
        mode: '0644'
      when: ecr_secret_refresh_manage | bool

    - name: Enable ECR token refresh timer when explicitly requested
      ansible.builtin.systemd_service:
        name: slice-sip-ecr-secret.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        - ecr_secret_refresh_manage | bool
        - not ansible_check_mode

    - name: Summarize result without exposing credentials
      ansible.builtin.debug:
        msg: >-
          CI files staged under {{ ci_directory }}. Docker not installed,
          upgraded, or restarted. Woodpecker start requested:
          {{ woodpecker_enable | bool }}. Next: approved HTTPS hostname,
          GitHub OAuth and protected secret file before first activation.
